# pyproject.toml
[build-system]
requires = ["setuptools>=42", "wheel", "setuptools_scm[toml]>=3.4", "numpy", "scikit-build-core>=0.9.0", "cmake>=3.15"]
build-backend = "scikit_build_core.build"


[tool.setuptools_scm]
write_to = "fc/_version.py"

[tool.pytest.ini_options]
addopts = "--import-mode importlib"
